        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
    patch:
      tags:
        - Statistics
      description: >
        Partially update the member's self-entered skills dataset.
        
        Authorization:
          - JWT roles: Restricted to the profile owner or `administrator`/`admin` roles.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/MemberSkillsRequest'
      responses:
        '200':
