    get:
      tags:
        - Statistics
      description: >
        Get member skills, including self-entered data and aggregated values.
        
        Authorization:
          - Public: Anonymous callers receive public skill summaries.
          - JWT roles: The profile owner or `administrator`/`admin` may view secure metadata and audit fields.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      parameters:
        - in: path
          name: handle
          required: true
          type: string
      responses:
        '200':
