swagger: '2.0'
info:
  version: V6
  title: Topcoder Member API
  description: >
    Services that provide access and interaction with all sorts of member profile details.


    # Pagination


    - Requests that return multiple items will be paginated to 20 items by
    default.


    - You can specify further pages with the `page` parameter (1 based).


    - You can also set a custom page size up to 100 with the `perPage`
    parameter.


    - Pagination response data is included in http headers.


    - By default, the response header contains links with `next`, `last`,
    `first`, `prev` resource links.

    # Roles

    Each API endpoint has described minimal role to access. Only users with
    specific roles can access those endpoints (where required). For insufficient
    role 403 Forbidden HTTP response will be returned.


    ## User roles:

      + `administrator`
      + `Connect Manager` 
      + `Connect Admin` 
      + `copilot`
      + `Client Manager` 
      + `Connect Account Manager`
      + `Connect Copilot Manager`

    # Personally Identifiable Information

    All endpoints that return member information must filter the response data
    to exclude the personally identifiable information (properties from a
    configurable array) unless the caller is a machine (M2M token), has
    administrative privileges or is the member himself.

    # Secure Member Fields
    
    ## Member Secure Fields
    
    Member identifiable info fields, only admin, M2M, or member himself can get these fields - `addresses`, `createdBy`, `updatedBy`
    
    ## Member Communication Fields 
    
    Member fields used for communication are accessible by managers, copilots, and admins.  These include: `firstName`, `lastName`, `email`
    
    ## Member Traits Secure Fields
    
    Member traits identifiable info fields, only admin, M2M, or member himself can fetch these fields - `createdBy`, `updatedBy`

    ## Search Secure Fields
    
    Member search identifiable info fields, only admin, M2M, or member himself can get these fields - `firstName`, `lastName`, `email`, `addresses`, `createdBy`, `updatedBy`

    ## Statistics Secure Fields
    
    Member statistics identifiable info fields, only admin, M2M, or member himself can fetch these fields - `createdBy`,`updatedBy`

    ## Miscellaneous Secure Fields
    
    Miscellaneous identifiable info fields, only admin, M2M, or member himself can fetch these fields - `createdBy`,`updatedBy`
    
    
    # Status codes:

    The HTTP status codes to communicate with the API consumer.

    + `200 OK` - Response to a successful GET, PUT, PATCH or DELETE.

    + `201 Created` - When a resource is successfully created with POST.

    + `400 Bad Request` - Malformed request; request body validation errors.

    + `401 Unauthorized` - When no or invalid authentication details are
    provided.

    + `403 Forbidden` - User authenticated, but doesn't have access to the
    resource.

    + `404 Not Found` - When a non-existent resource is requested.

    + `500 Server Error` - Something went wrong on the API end.
    
    
    # Authorization:
    
    Authorization is when an entity proves a right to access.
    
    ## HTTP Authentication Schemes
    
    Bearer Authentication (also called token authentication) is an HTTP authentication scheme that involves security tokens called bearer tokens. We will be using Auth0 tokens that could be JWT or M2M
    
    
    The client must send this token in the Authorization header when making requests to protected resources:
    
    
    `Authorization: Bearer <token>`
    
    
    ## Authorization via M2M tokens
    
    There are various areas in topcoder or third parties that need to communicate with each other like: service to service, daemon to backend, CLI client to internal service, IoT tools, for such scenarios we use machine to machine.
    
    
    These M2M tokens are from Auth0, and based on scopes grant access to our functionality. Here are few scopes that should be adhered to: `create:user_profiles`, `read:user_profiles`, `update:user_profiles`, `delete:user_profiles`, `all:user_profiles`
    
    
    ## Authorization via JWT tokens
    
    User based security tokens should be supported. Logic filtering of data should be achieved via the user based token and role. At least support for role admin vs user should be designed.
    
    
    ## Important Note:
    
    + Tokens can be passed via headers.authorization / query.authToken, recommended way is to pass via headers.authorization.
    
    + While passing Authorize bearer token make sure to add `Bearer <token>`
  license:
    name: MIT
    url: 'http://github.com/gruntjs/grunt/blob/master/LICENSE-MIT'
basePath: /v6
schemes:
  - https
  - http
securityDefinitions:
  bearer:
    type: apiKey
    name: Authorization
    in: header
produces:
  - application/json
consumes:
  - application/json
paths:
  '/members/health':
    get:
      tags:
        - Health
      description: Check service readiness using the primary members database
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Health'
        '503':
          description: Members database is unavailable or responding too slowly
          schema:
            $ref: '#/definitions/ErrorModel'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/challenge-points/{challengeId}':
    put:
      tags:
        - Basic
      description: |-
        Replace the stored point awards for one challenge. This endpoint mirrors point-based challenge prize payouts into member-api so member profiles can return challenge point totals and per-challenge details.

        Authorization:
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: challengeId
          required: true
          type: string
          description: Challenge identifier whose point rows should be replaced.
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ChallengePointsUpdateRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ChallengePointsUpdateResult'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}':
    get:
      tags:
        - Basic
      description: |-
        Get member profile with a specified member handle. You may filter on member response fields.

        The authentication credential is optional and allows secured fields in the response.

        Authorization:
          - Public: Without a token responses omit secure and communication fields.
          - JWT roles: The profile owner or `administrator`/`admin` roles may view secure fields. Autocomplete roles (`copilot`, `administrator`, `admin`, `Connect Copilot`, `Connect Account Manager`, `Connect Admin`, `Account Executive`) may view communication fields.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - name: fields
          in: query
          required: false
          type: string
          description: >
            fields=fieldName1,fieldName2,...,fieldN
            
            
            parameter for choosing which fields of Member profile that will be included in response. By default, all will be returned.
            
            
            The following fields are allowed
            
            + userId - Select the field 
            
            + handle - Select the field handle
            
            + handleLower - Select the field handleLower
            
            + firstName - Select the field firstName
            
            + lastName - Select the field lastName
            
            + tracks - Select the field tracks
            
            + status - Select the field status
            
            + addresses - Select the field addresses
            
            + description - Select the field description
            
            + email - Select the field email
            
            + homeCountryCode - Select the field homeCountryCode
            
            + competitionCountryCode - Select the field competitionCountryCode
            
            + photoURL - Select the field photoURL
            
            + maxRating - Select the field maxRating
            
            + createdAt - Select the field createdAt
            
            + createdBy - Select the field createdBy
            
            + updatedAt - Select the field updatedAt
            
            + updatedBy - Select the field updatedBy
            
            + verified - Select the field verified
            
            The following fields are secured, without a valid token will not be in response
            
            + firstName
            
            + lastName
            
            + addresses
            
            + email
            
            + createdBy
            
            + updatedBy
            
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MemberProfile'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
    put:
      tags:
        - Basic
      description: |-
        Update the member profile by handle.

        Handle updates are not supported on this endpoint. Use `PATCH /members/{handle}/change_handle` to change handles.

        If the email has been changed, the email change process starts and a verification email is sent to the new and old email address.

        Authorization:
          - JWT roles: Only the profile owner or users with `administrator`/`admin` roles may update member data.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: query
          name: verifyUrl
          required: false
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/MemberProfile'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MemberProfile'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/change_handle':
    patch:
      tags:
        - Basic
      description: |-
        Update the member handle.

        Authorization:
          - JWT roles: Only the profile owner or users with `administrator`/`admin` roles may update member data.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: query
          name: fields
          required: false
          type: string
          description: >
            Comma separated list of fields to include in the response. Defaults to all member fields.
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/MemberHandleUpdate'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MemberProfile'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/profileCompleteness':
    get:
      tags:
        - Basic
      description: >
        Compute profile completeness metadata for the specified member, including
        which profile sections are complete and the next suggested item to finish.
        
        Authorization:
          - JWT roles: Restricted to the profile owner or users with `administrator`/`admin` roles.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: query
          name: toast
          required: false
          type: string
          description: Override the suggested toast item in the response.
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ProfileCompleteness'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/verify':
    get:
      tags:
        - Basic
      description: |-
        Verify a member's new email address.

        When the email has been changed, the email change process starts and a verification email is sent to the new and old addresses. The link from each email redirects the member to this API.

        Both the old and new email address must be verified by the member to successfully complete the process.

        Authorization:
          - JWT roles: Only the profile owner or `administrator`/`admin` may verify the email change.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: query
          name: token
          type: string
          required: true
          description: the email verification token
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/EmailVerificationResult'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/photo':
    post:
      tags:
        - Basic
      description: |-
        Upload a member's photo. The service saves the file from the request into AWS S3 and updates the member profile with the new photo URL.

        Authorization:
          - JWT roles: Only the profile owner or `administrator`/`admin` may upload a photo.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      consumes:
        - multipart/form-data
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: formData
          name: photo
          type: file
          required: true
          description: The image file to upload
      responses:
        '200':
          description: OK, it returns the uploaded photo URL
          schema:
            $ref: '#/definitions/UploadPhotoResult'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/confirmProfile':
    post:
      tags:
        - Basic
      description: |-
        Confirm member profile data by setting the lastProfileConfirmationDate to the current timestamp.
        
        This endpoint allows a member to confirm they have reviewed and verified their profile information is current and accurate.
        
        Authorization:
          - JWT roles: Only the profile owner or `administrator`/`admin` may confirm the profile.
          - M2M scopes: `update:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
          description: The member handle
      responses:
        '200':
          description: OK - Profile confirmation date successfully updated
          schema:
            $ref: '#/definitions/MemberProfile'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission - User is not the profile owner or admin
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found - Member with the specified handle does not exist
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/profileDownload':
    get:
      tags:
        - Basic
      description: |-
        Download a member's profile as a PDF document.
        
        The PDF contains member profile information
        
        Authorization:
          - JWT roles: Restricted to the profile owner, users with `administrator`/`admin` roles, or Project Managers.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      produces:
        - application/pdf
      parameters:
        - in: path
          name: handle
          required: true
          type: string
          description: The member handle
      responses:
        '200':
          description: OK - PDF file download
          schema:
            type: string
            format: binary
          headers:
            Content-Type:
              type: string
              description: application/pdf
            Content-Disposition:
              type: string
              description: attachment; filename="profile-{handle}.pdf"
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission - User is not the profile owner, admin, or PM
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found - Member with the specified handle does not exist
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/sendgrid-emails':
    get:
      tags:
        - Basic
      description: |-
        Get up to the 20 most recent SendGrid email activity records sent to the member's current email address in the last 30 days.

        Authorization:
          - JWT roles: Only `administrator` or `admin`.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
          description: The member handle
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              type: object
              additionalProperties: true
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found - Member with the specified handle does not exist
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/skills/{skillid}':
    get:
      tags:
        - Basic
      description: |-
        Get a specific member skill by skill ID.

        Authorization:
          - Public: Without a token responses omit secure and communication fields.
          - JWT roles: The profile owner or `administrator`/`admin` roles may view secure fields.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: path
          name: skillid
          required: true
          type: string
          description: The skill id to retrieve
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MemberSkillsWithActivity'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'

  /members:
    get:
      tags:
        - Search
      description: |-
        Search members by `userId`, `userIds`, `handle`, `handles`, `handleLower`, or `handlesLower`, and retrieve profile details with stats and skills.

        Searching by `handle` performs a like match, whereas `handleLower` performs an exact match against the data store.

        Authentication credentials are optional. If the API is called by Admin or M2M, secured fields are included; otherwise they are excluded from the response.

        Authorization:
          - Public: Allowed without a token; responses omit secure and communication fields.
          - JWT roles: Any authenticated member can query basic data. Secure fields require the caller to own the profile or hold `administrator`/`admin`. Email searches additionally require `administrator`, `admin`, or `tgadmin`. Communication fields (firstName, lastName, email) require autocomplete roles (`copilot`, `administrator`, `admin`, `Connect Copilot`, `Connect Account Manager`, `Connect Admin`, `Account Executive`).
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - name: userId
          in: query
          required: false
          type: string
          description: filter by userId
        - name: userIds
          in: query
          required: false
          type: string
          description: filter by userIds. Example - [userId1,userId2,userId3,...,userIdN]
        - name: handle
          in: query
          required: false
          type: string
          description: filter by handle. This will return like search.
        - name: handles
          in: query
          required: false
          type: string
          description: filter by handles. This will return like search. Example - ["handle1","handle2","handle3",...,"handleN"]
        - name: handleLower
          in: query
          required: false
          type: string
          description: filter by handle. This will return an exact search.
        - name: handlesLower
          in: query
          required: false
          type: string
          description: filter by handles. This will return an exact search. Example - ["handle1","handle2","handle3",...,"handleN"]
        - name: sort
          in: query
          required: false
          type: string
          description: sort by asc or desc
        - name: fields
          in: query
          required: false
          type: string
          description: >
            fields=fieldName1,fieldName2,...,fieldN
            
            
            parameter for choosing which fields of members profile that will be included in response.
            
            + userId - Select the field userId
            
            + handle - Select the field handle
            
            + handleLower - Select the field handleLower
            
            + firstName - Select the field firstName
            
            + lastName - Select the field lastName
            
            + status - Select the field status
            
            + addresses - Select the field addresses
            
            + photoURL - Select the field photoURL
            
            + homeCountryCode - Select the field homeCountryCode
            
            + competitionCountryCode - Select the field competitionCountryCode
            
            + description - Select the field description
            
            + email - Select the field email
            
            + tracks - Select the field tracks
            
            + maxRating - Select the field maxRating
            
            + wins - Select the field wins
            
            + createdAt - Select the field createdAt
            
            + createdBy - Select the field createdBy
            
            + updatedAt - Select the field updatedAt
            
            + updatedBy - Select the field updatedBy
            
            + skills - Select the field skills
            
            + stats - Select the field stats
            
            
            The following fields are secured, without a valid token will not be in response
            
            + firstName
            
            + lastName
            
            + email
            
            + addresses
            
            + createdBy
            
            + updatedBy
        - $ref: '#/parameters/page'
        - $ref: '#/parameters/perPage'
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/MemberSearchDataItem'
          headers:
            X-Next-Page:
              type: integer
              description: The index of the next page
            X-Page:
              type: integer
              description: The index of the current page (starting at 1)
            X-Per-Page:
              type: integer
              description: The number of items to list per page
            X-Prev-Page:
              type: integer
              description: The index of the previous page
            X-Total:
              type: integer
              description: The total number of items
            X-Total-Pages:
              type: integer
              description: The total number of pages
            Link:
              type: string
              description: Pagination link header.
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission to access the API
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  "/members/autocomplete":
    get:
      tags:
        - Search
      description: |-
        Search members by a term that matches their handle. Matching profiles return `userId`, `handle`, `firstName`, and `lastName`.

        This service is best suited for autocomplete features where the payload should be lightweight and fast.

        The service performs a like match and sorts results by whether the string appears before, after, or equals the given term in sort order.

        Authorization:
          - JWT roles: Requires an authenticated member. Communication fields (firstName, lastName, email) are returned only for autocomplete roles (`copilot`, `administrator`, `admin`, `Connect Copilot`, `Connect Account Manager`, `Connect Admin`, `Account Executive`).
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - name: term
          in: query
          required: false
          type: string
          description: filter by term. term is mactehd with member handle.
        - name: fields
          in: query
          required: false
          type: string
          description: >
            fields=fieldName1,fieldName2,...,fieldN
            
            
