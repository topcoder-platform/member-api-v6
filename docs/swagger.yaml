  '/members/{handle}/stats/refresh':
    post:
      x-internal: true
      tags:
        - Statistics
      description: >
        Refreshes unified member stats for the member from completed review-api challenge results.
        `challengeId` is accepted for compatibility and echoed in the response summary.
        Callable by admin users or M2M tokens with `refresh:member_stats` scope.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: body
          name: body
          required: false
          schema:
            type: object
            properties:
              challengeId:
                type: string
                description: Optional UUID or legacy numeric challenge identifier echoed in the response summary.
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StatsRefreshResult'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/stats/rerate':
    post:
      x-internal: true
      tags:
        - Statistics
      description: >
        Triggers a re-rating pass for the member starting from the specified challenge.
        All subsequent challenges in the same track/type are also re-rated to maintain accuracy.
        When `ratingName` is supplied, the named configurable rating path
        is re-rated across matching Development Challenge and Marathon Match events and
        stored under the configured destination track / `{ratingName}`. Rating paths can
        match any configured challenge tag and/or require every configured challenge skill ID.
        Callable by admin users or M2M tokens with `rerate:member_stats` scope.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - challengeId
            properties:
              challengeId:
                type: string
                description: UUID or legacy numeric challenge identifier that starts the rerate request.
              ratingName:
                type: string
                description: Optional configured rating path name, for example `AI Engineering` or `Java MySQL`.
              trackId:
                type: string
                enum:
                  - DEVELOP
                  - DATA_SCIENCE
              typeId:
                type: string
                enum:
                  - Challenge
                  - MARATHON_MATCH
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StatsRerateResult'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Miss or wrong authentication credentials
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: No permission
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
