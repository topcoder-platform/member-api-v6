  '/members/{handle}/stats/roles':
    get:
      tags:
        - Statistics
      description: >
        Get the count-only Copilot and Reviewer special-role summary displayed
        on a member profile. Counts are distinct resource challenge IDs. A
        challenge with more than one matching reviewer role is counted once,
        and a role key is omitted when its count is zero. Reviewer assignments
        include exactly Iterative Reviewer, Primary Reviewer, Reviewer, Failure
        Reviewer, Final Reviewer, Aggregator, Stress Reviewer, Accuracy
        Reviewer, Primary Screener, Checkpoint Screener, and Checkpoint
        Reviewer. Copilot assignments use the Copilot resource role. This cheap
        summary reads only the resources schema and does not load challenge
        names or Copilot track/fulfillment details.

        Authorization:
          - Public: Anonymous callers may retrieve the count-only summary.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      parameters:
        - in: path
          name: handle
          required: true
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/SpecialRoleStats'
        '400':
          description: Bad request data
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Member not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/stats/roles/{role}/challenges':
    get:
      tags:
        - Statistics
      description: >
        Get every newest-first distinct challenge assigned to a member's Copilot
        or Reviewer role in one response. Reviewer assignments use the exact
        role list documented on the summary endpoint and multiple reviewer
        assignments for one challenge collapse into one item. Ordering uses
        challenge end date, then start/creation date fallbacks, followed by
        resource assignment time and challenge ID tie-breakers.
        `resourceCreatedAt` is assignment creation time and is not a
        review-completion timestamp.

        Detail totals, items, Copilot track counts, and fulfillment include only
        challenges visible to an anonymous Challenge API caller: challenges have
        no groups, no user-whitelist rows, and are not tasks. Restricted
        challenge IDs and names are never returned.

        Copilot `trackCounts` includes only non-zero Development, Design,
        Quality Assurance, and Data Science keys. Fulfillment is
        `COMPLETED / (COMPLETED + CANCELLED*) * 100`; `CANCELLED` and every
        `CANCELLED_*` status count as cancelled, non-terminal statuses are
        excluded, a zero denominator returns 0, and the percentage is rounded
        to two decimal places on a 0-100 scale.

        Cross-schema detail queries require the `challenges` and `resources`
        schemas to be co-located in the challenge database, as in the supported
        deployment. A split-database deployment receives `503 Service
        Unavailable` for details while the resource-only summary remains usable.

        Authorization:
          - Public: Anonymous callers may retrieve anonymous-visible challenges.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
      parameters:
        - in: path
          name: handle
          required: true
          type: string
        - in: path
          name: role
          required: true
          type: string
          enum:
            - copilot
            - reviewer
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/SpecialRoleChallenges'
        '400':
          description: Invalid role
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Member not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '503':
          description: Required co-located challenges/resources schemas are unavailable
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
  '/members/{handle}/stats/history':
    get:
      tags:
        - Statistics
      description: >
        Get member history statistics, by default only returns the public Topcoder history statistics.
        Results can be filtered by challenge track and challenge type for more granular historical views.
        When persisted history rows are missing or incomplete for a visible track/type pair, challenge cards are synthesized
        from available completed challenge-result sources so challenge-level history still appears. Non-completed
        challenges are excluded from the response. Fallback rows may omit
        rating fields when no authoritative rating snapshot exists.
        
        Filtering behavior:
          - `trackId` only: returns all history statistics for that track across all types.
          - `typeId` only: returns all history statistics for that type across all tracks.
          - `trackId` + `typeId`: returns history statistics for the specific track-type combination.
          - Neither `trackId` nor `typeId`: returns all history statistics.
          - For non-rated tracks/types (for example, Design or First2Finish), rating and rank fields are `null`.
        
        Authorization:
          - Public: Anonymous callers receive only public history statistics.
          - JWT roles: The profile owner or `administrator`/`admin` may view secure history data.
          - M2M scopes: `read:user_profiles` or `all:user_profiles`.
