        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'
    post:
      tags:
        - Statistics
      description: >
        Create or replace the member's self-entered skills dataset.
        
        Authorization:
          - JWT roles: Restricted to the profile owner or `administrator`/`admin` roles.
          - M2M scopes: `create:user_profiles` or `all:user_profiles`.
      security:
        - bearer: []
      parameters:
        - in: path
          name: handle
