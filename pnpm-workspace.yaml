packages:
  - .

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  aws-sdk: false
  dtrace-provider: false
  prisma: true
  sharp: true
  tc-identity-service@https://codeload.github.com/topcoder-platform/identity-api-v6/tar.gz/1b34a83edf9382dd16e8289a5704702a6b19b9d6: false
  tc-payments-api@https://codeload.github.com/topcoder-platform/tc-finance-api/tar.gz/e5322a5b39f519573934264551ec2ca6a86f88ea: false
  topcoder-challenge-recources-api@https://codeload.github.com/topcoder-platform/resource-api-v6/tar.gz/c15912780c8c49fe65e03e22235db7b1e2aecdae: false
  topcoder-challenges-api@https://codeload.github.com/topcoder-platform/challenge-api-v6/tar.gz/f1e5dad7178b002d4fcfc920f9ca2b3a39921f8b: false

# topcoder-bus-api-wrapper intentionally resolves tc-core-library-js from Git.
# Preserve that established dependency graph when using pnpm 11's stricter defaults.
blockExoticSubdeps: false

